name: Deploy to Kubernetes

on:
  workflow_call:
    inputs:
      bastion_ip:
        type: string
        required: true
      master_ip:
        type: string
        required: true
      alb_dns:
        type: string
        required: true

env:
  AWS_REGION: us-east-1   # لازم يطابق region في terraform.tfvars

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS profile
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" --profile new-user
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" --profile new-user
          aws configure set region "$AWS_REGION" --profile new-user

      - name: Write SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/key-mo.pem
          chmod 400 ~/key-mo.pem

      - name: Allow runner IP on bastion SG
        id: sg
        run: |
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com | tr -d '\n')
          SG_ID=$(aws ec2 describe-security-groups --profile new-profile --region "$AWS_REGION" \
            --filters Name=group-name,Values=library-dev-bastion-sg \
            --query 'SecurityGroups[0].GroupId' --output text)
          aws ec2 authorize-security-group-ingress --profile new-profile --region "$AWS_REGION" \
            --group-id "$SG_ID" --protocol tcp --port 22 --cidr "$RUNNER_IP/32" || true
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"
          echo "sg_id=$SG_ID" >> "$GITHUB_OUTPUT"

      # بنحط اسم الـ Docker Hub user ورقم الـ commit مكان الـ placeholders في ملفات kubernetes/
      - name: Set image names and tag in manifests
        run: |
          find kubernetes -name '*.yaml' -o -name '*.yml' | xargs sed -i \
            -e "s|DOCKERHUB_USER|${{ secrets.DOCKERHUB_USERNAME }}|g" \
            -e "s|IMAGE_TAG|${{ github.sha }}|g"

      - name: Copy manifests to master and apply
        env:
          BASTION_IP: ${{ inputs.bastion_ip }}
          MASTER_IP: ${{ inputs.master_ip }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          KEY=~/key-mo.pem
          PROXY="ssh -i $KEY -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p -q ubuntu@$BASTION_IP"
          SSH_OPTS=(-i "$KEY" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o "ProxyCommand=$PROXY")

          ssh "${SSH_OPTS[@]}" ubuntu@$MASTER_IP "rm -rf ~/deploy && mkdir -p ~/deploy"
          scp -r "${SSH_OPTS[@]}" kubernetes ubuntu@$MASTER_IP:~/deploy/
          scp "${SSH_OPTS[@]}" app/database/init.sql ubuntu@$MASTER_IP:~/deploy/

          # الـ secrets بتتبعت base64 عشان أي رموز خاصة في الباسورد ما تبوّظش الأمر
          DB_B64=$(printf %s "$DB_PASSWORD" | base64 -w0)
          JWT_B64=$(printf %s "$JWT_SECRET" | base64 -w0)

          ssh "${SSH_OPTS[@]}" ubuntu@$MASTER_IP bash -s <<REMOTE
          set -e
          cd ~/deploy
          kubectl create namespace library --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n library create configmap db-init --from-file=init.sql --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n library create secret generic library-secrets \
            --from-literal=DB_PASSWORD="\$(echo $DB_B64 | base64 -d)" \
            --from-literal=JWT_SECRET="\$(echo $JWT_B64 | base64 -d)" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -R -f kubernetes/
          kubectl -n library rollout status statefulset/db --timeout=180s
          kubectl -n library rollout status deployment/auth-service --timeout=180s
          kubectl -n library rollout status deployment/catalog-service --timeout=180s
          kubectl -n library rollout status deployment/frontend --timeout=180s
          kubectl -n library get pods -o wide
          REMOTE

      - name: Summary
        run: |
          echo "### Deployed ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "Website: http://${{ inputs.alb_dns }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Revoke runner IP
        if: ${{ always() && steps.sg.outputs.sg_id != '' }}
        run: |
          aws ec2 revoke-security-group-ingress --profile new-profile --region "$AWS_REGION" \
            --group-id "${{ steps.sg.outputs.sg_id }}" --protocol tcp --port 22 \
            --cidr "${{ steps.sg.outputs.runner_ip }}/32" || true
