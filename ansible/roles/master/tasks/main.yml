- name: Check if cluster is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: admin_conf

- name: kubeadm init
  ansible.builtin.command: >
    kubeadm init
    --apiserver-advertise-address={{ ansible_default_ipv4.address }}
    --pod-network-cidr={{ pod_network_cidr }}
  when: not admin_conf.stat.exists
  register: kubeadm_init

- name: Create .kube directory for ubuntu user
  ansible.builtin.file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Copy admin.conf to ubuntu user
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/ubuntu/.kube/config
    remote_src: true
    owner: ubuntu
    group: ubuntu
    mode: "0600"

- name: Install Calico network plugin
  ansible.builtin.command: >
    kubectl apply -f
    https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/calico.yaml
  become: false
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  when: kubeadm_init is changed

# كلاستر kubeadm مفيهوش storage تلقائي، فبنركّب local-path عشان الـ PVC بتاع الـ database
- name: Install local-path storage provisioner
  ansible.builtin.command: >
    kubectl apply -f
    https://raw.githubusercontent.com/rancher/local-path-provisioner/{{ local_path_version }}/deploy/local-path-storage.yaml
  become: false
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  changed_when: false

- name: Make local-path the default StorageClass
  ansible.builtin.command: >
    kubectl patch storageclass local-path
    -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
  become: false
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  changed_when: false

- name: Create join command for workers
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_cmd
  changed_when: false

- name: Save join command as a fact
  ansible.builtin.set_fact:
    join_command: "{{ join_cmd.stdout }}"
