apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: library
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          # الـ pipeline بيبدّل DOCKERHUB_USER و IMAGE_TAG
          image: DOCKERHUB_USER/library-auth-service:IMAGE_TAG
          ports:
            - containerPort: 3001
          env:
            - name: DB_HOST
              value: db
            - name: DB_USER
              value: library
            - name: DB_NAME
              value: library
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: library-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: library-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 192Mi
